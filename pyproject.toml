[project]
name = "fineco"
version = "0.1.0"
description = "Financial econometrics toolkit: yield curves, GARCH, cointegration, EVT, copulas, forecast evaluation"
requires-python = ">=3.10"
authors = [{name = "Dr. Muhammad Imran Bhatti"}]
dependencies = ["numpy", "pandas", "scipy", "statsmodels", "arch", "matplotlib"]

[tool.setuptools]
packages = ["fineco"]

[tool.pytest.ini_options]
pythonpath = ["."]
